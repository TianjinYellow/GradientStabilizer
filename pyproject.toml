[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gradient-stabilizer"
version = "0.1.0"
description = "EMA-based gradient magnitude stabilization for PyTorch optimizers."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Tianjin Huang" }
]
keywords = ["pytorch", "optimizer", "gradient", "training-stability", "deep-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=1.12"
]

[project.urls]
Homepage = "https://github.com/TianjinYellow/GradientStabilizer"
Repository = "https://github.com/TianjinYellow/GradientStabilizer"
Issues = "https://github.com/TianjinYellow/GradientStabilizer/issues"

[tool.setuptools.packages.find]
where = ["src"]
